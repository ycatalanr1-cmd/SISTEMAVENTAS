$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Manual de Usuario
  structure:
    - type: section
      key: section-1
      title: Documentation
      path: documentation
      icon: book-blank
      default: true
      children:
        - type: space
          key: space-1
          title: Documentation
          path: documentation
          default: true
          content:
            directory: ./documentation
    - type: section
      key: section-2
      title: MANUAL TECNICO
      path: manual-tecnico
      children:
        - type: space
          key: space-2
          title: Product Docs
          path: product-docs
          default: true
          content:
            directory: ./manual-tecnico/product-docs
