          key: space-2
          title: MANUAL TECNICO
          path: product-docs
          default: true
          content:
            directory: ./manual-tecnico/product-docs
    - type: section
      key: section-3
      title: MANUAL DE INSTALACIÓN
      path: manual-de-instalacion
      children:
        - type: space
          key: space-3
          title: Product Docs
          path: product-docs
          default: true
